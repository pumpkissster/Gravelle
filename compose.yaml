services:
  gravelle:
    # 正式发布后填写 Docker Hub 完整镜像名与版本；未配置时明确停止。
    image: "${GRAVELLE_IMAGE:?请在 .env 中设置已发布的 GRAVELLE_IMAGE 镜像地址}"
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${WEB_PORT:-8080}:8080"
      # 可选：网页启用独立分享端口后，取消下一行注释并重新创建容器。
      # 容器内固定 8081；左侧宿主机端口可自定。公网穿透只指向此分享端口。
      # - "${SHARE_WEB_PORT:-8081}:8081"
    environment:
      # 写真/漫画媒体库只能选择此目录及其子目录；网页填容器路径。
      LIBRARY_PATH: /library
      DATA_PATH: /data
      HOST: 0.0.0.0
      PORT: "8080"
      READER_PASSWORD: "${READER_PASSWORD:-}"
      SCAN_INTERVAL: "${SCAN_INTERVAL:-300}"
    volumes:
      - type: bind
        source: "${COMICS_PATH:-./library}"
        target: /library
        read_only: true
      - type: bind
        source: "${DATA_PATH:-./data}"
        target: /data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
