<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#191618">
  <title>写真分享 · Gravelle</title>
  <link rel="icon" href="/gravelle-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/share-reader.css">
  <script defer src="/vendor/noble-gcm.js"></script>
  <script defer src="/share-crypto.js"></script>
  <script defer src="/reader-model.js"></script>
  <script defer src="/share-reader.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
    <symbol id="i-left" viewBox="0 0 24 24"><g class="remixicon"><path d="M10.8284 12.0007L15.7782 16.9504L14.364 18.3646L8 12.0007L14.364 5.63672L15.7782 7.05093L10.8284 12.0007Z"></path></g></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><g class="remixicon"><path d="M13.1717 12.0007L8.22192 7.05093L9.63614 5.63672L16.0001 12.0007L9.63614 18.3646L8.22192 16.9504L13.1717 12.0007Z"></path></g></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><g class="remixicon"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"></path></g></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><g class="remixicon"><path d="M8 3V5H4V9H2V3H8ZM2 21V15H4V19H8V21H2ZM22 21H16V19H20V15H22V21ZM22 9H20V5H16V3H22V9Z"/></g></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><g class="remixicon"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM13 13.3551V14H11V12.5C11 11.9477 11.4477 11.5 12 11.5C12.8284 11.5 13.5 10.8284 13.5 10C13.5 9.17157 12.8284 8.5 12 8.5C11.2723 8.5 10.6656 9.01823 10.5288 9.70577L8.56731 9.31346C8.88637 7.70919 10.302 6.5 12 6.5C13.933 6.5 15.5 8.067 15.5 10C15.5 11.5855 14.4457 12.9248 13 13.3551Z"/></g></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><g class="remixicon"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"></path></g></symbol>
  </svg>
  <main id="share-gate" class="share-gate">
    <section class="share-access" aria-labelledby="share-access-title">
      <img class="share-wordmark" src="/gravelle-wordmark.svg" alt="Gravelle">
      <h1 id="share-access-title">输入访问密码</h1>
      <p id="share-gate-message" class="share-description" role="status" aria-live="polite">正在检查分享…</p>
      <form id="share-unlock-form" hidden>
        <label class="share-password-label" for="share-password">访问密码</label>
        <input id="share-password" type="password" maxlength="64" autocomplete="off" required>
        <p id="share-password-error" class="share-password-error" role="alert" hidden></p>
        <button id="share-unlock" type="submit" class="share-primary">进入阅读</button>
      </form>
      <button id="share-gate-retry" type="button" class="share-secondary" hidden>重试</button>
    </section>
  </main>
  <section id="share-reader" class="reader share-reader" aria-label="分享阅读器" data-theme="dark" data-mode="single" data-fit="height" data-direction="ltr" data-controls="visible" hidden>
    <div class="reader-shell">
      <header class="reader-toolbar">
        <button id="share-exit" class="icon-button" type="button" aria-label="退出分享阅读" title="退出阅读"><svg aria-hidden="true"><use href="#i-left"/></svg></button>
        <div class="reader-title-wrap"><h2 id="share-title"></h2></div>
        <div class="reader-options">
          <div class="reader-choice"><button id="share-mode-trigger" class="reader-choice-trigger" type="button" aria-label="阅读方式" aria-haspopup="listbox" aria-expanded="false" aria-controls="share-choice-popover"><span id="share-mode-value">单页</span><svg class="reader-choice-chevron" aria-hidden="true"><use href="#i-right"/></svg></button></div>
          <div class="reader-choice"><button id="share-direction-trigger" class="reader-choice-trigger" type="button" aria-label="阅读方向" aria-haspopup="listbox" aria-expanded="false" aria-controls="share-choice-popover"><span id="share-direction-value">左 → 右</span><svg class="reader-choice-chevron" aria-hidden="true"><use href="#i-right"/></svg></button></div>
          <div class="reader-choice"><button id="share-fit-trigger" class="reader-choice-trigger" type="button" aria-label="图片适配" aria-haspopup="listbox" aria-expanded="false" aria-controls="share-choice-popover"><span id="share-fit-value">适应屏幕</span><svg class="reader-choice-chevron" aria-hidden="true"><use href="#i-right"/></svg></button></div>
          <button id="share-theme" class="icon-button" type="button" aria-label="切换为浅色阅读背景" title="切换阅读背景"><svg aria-hidden="true"><use href="#i-sun"/></svg></button>
          <button id="share-fullscreen" class="icon-button" type="button" aria-label="进入全屏" title="全屏 (Enter)"><svg aria-hidden="true"><use href="#i-fullscreen"/></svg></button>
          <button id="share-help" class="icon-button" type="button" aria-label="查看阅读快捷键" aria-expanded="false" aria-controls="share-help-panel"><svg aria-hidden="true"><use href="#i-help"/></svg></button>
        </div>
      </header>
      <div class="reader-body">
        <div id="share-viewport" class="reader-viewport share-viewport" tabindex="0" aria-label="图片阅读区域">
          <div id="share-paged-view" class="paged-view">
            <button id="share-tap-previous" class="tap-zone tap-left" type="button" aria-label="上一页" tabindex="-1"></button>
            <div id="share-image-host" class="page-image-wrap share-image-host"></div>
            <button id="share-tap-next" class="tap-zone tap-right" type="button" aria-label="下一页" tabindex="-1"></button>
          </div>
          <div id="share-scroll-view" class="scroll-view" hidden></div>
          <div id="share-page-message" class="page-loading share-page-message" role="status" aria-live="polite"><span id="share-page-message-text"></span><button id="share-page-retry" type="button" class="button button-secondary" hidden>重试本页</button></div>
        </div>
      </div>
      <footer class="reader-footer">
        <div class="page-navigation">
          <button id="share-previous" class="icon-button" type="button" aria-label="上一页"><svg aria-hidden="true"><use href="#i-left"/></svg></button>
          <form id="share-page-form" class="page-number" dir="ltr"><label class="sr-only" for="share-page-number">跳转页码</label><input id="share-page-number" type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码"><span id="share-page-total"></span></form>
          <button id="share-next" class="icon-button" type="button" aria-label="下一页"><svg aria-hidden="true"><use href="#i-right"/></svg></button>
        </div>
        <label class="page-slider-label"><span class="sr-only">页码滑块</span><input id="share-page-slider" type="range" min="0" max="0" value="0" aria-label="跳转到页面"></label>
        <span id="share-mode-hint" class="reader-key-hint">↑ ↓ 翻页 · ? 帮助</span>
      </footer>
      <div class="reader-floating">
        <section id="share-menu" class="reader-menu" aria-label="快捷阅读设置" hidden>
          <strong>阅读工具</strong>
          <button id="share-menu-mode" type="button">切换单页 / 双页</button>
          <label><input id="share-cover-alone" type="checkbox" checked> 封面单独显示</label>
          <label><input id="share-spread-offset" type="checkbox"> 跨页配对校正</label>
          <button id="share-menu-theme" type="button">切换日间 / 夜间</button>
          <small>双页在窄屏下自动显示为单页。</small>
        </section>
        <button id="share-menu-toggle" class="reader-page-float" type="button" aria-label="打开阅读工具" aria-expanded="false" aria-controls="share-menu"><span id="share-floating-page">—</span><small>阅读工具 · ⋯</small></button>
      </div>
      <section id="share-help-panel" class="reader-help-panel" aria-label="阅读快捷键" hidden>
        <button id="share-help-close" class="icon-button" type="button" aria-label="关闭快捷键帮助"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
        <h3>专注影像，轻松翻页。</h3>
        <dl>
          <dt>↑ / ↓</dt><dd>上一页 / 下一页；连续阅读中滚动</dd>
          <dt>← / →</dt><dd id="share-help-arrows">上一页 / 下一页，跟随阅读方向</dd>
          <dt>PageUp / PageDown / 空格</dt><dd>上一页 / 下一页</dd>
          <dt>Home / End</dt><dd>第一张 / 最后一张图片</dd>
          <dt>Enter</dt><dd>进入 / 退出全屏</dd>
          <dt>Backspace / Esc</dt><dd>退出分享阅读</dd>
          <dt>M</dt><dd>显示 / 隐藏阅读菜单</dd>
          <dt>?</dt><dd>显示 / 关闭此帮助</dd>
        </dl>
        <p id="share-help-description">点击画面中央显示阅读菜单，两侧点击或左右滑动可翻页。双页时从右到左会交换图片左右位置。</p>
      </section>
      <div id="share-choice-popover" class="reader-choice-popover" role="listbox" tabindex="-1" hidden></div>
    </div>
  </section>
</body>
</html>
